[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  NITRO_PRESET = "netlify"

# Nitro's Netlify preset emits public assets to dist and the SSR handler as a
# Netlify function. It also writes the routing redirects itself, so no manual
# [[redirects]] are needed here.
